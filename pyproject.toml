[build-system]
requires = ["setuptools >= 69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csds-352-vault"
version = "0.0.1"
description = "Data Science and Machine Learning Vault"
authors = [{name = "Jala R&D", email = "RD_GenerativeAI@jalasoft.com"}]
license = {file = "LICENSE"}
requires-python = ">=3.12"

dependencies = [
  "ipykernel==7.0.1",
  "ipympl==0.9.8",
  "matplotlib==3.10.7",
  "numpy==2.3.4",
  "pandas==2.3.3",
  "rich==14.2.0",
  "scikit-learn==1.7.2",
  "torch==2.9.0",
  "torchvision==0.24.0",
  "seaborn==0.13.2",
  "sentence-transformers==5.1.1",
  "fastapi==0.119.0",
  "uvicorn==0.38.0",
  "streamlit==1.50.0",
  "python-multipart==0.0.20",
  "pymupdf==1.26.5",
  "pydantic==2.12.3",
  "pydantic-settings==2.11.0",
  "langchain==1.0.0",
  "langchain_chroma==1.0.0",
  "langchain-community==0.4",
  "langchain_core==1.0.0",
  "langchain-google-genai==3.0.0",
  "langchain_text_splitters==1.0.0",
  "langchain_huggingface==1.0.0",
  "google-genai==1.45.0",
  "plotly==6.3.1"
]

[project.scripts]
csds-352-vault = "app.main:main"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pymupdf.*", "plotly.*", "sklearn.*", "requests.*"]
ignore_missing_imports = true