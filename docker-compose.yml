services:
  chroma:
    image: chromadb/chroma
    container_name: chromadb
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - backend_net

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fastapi_app
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      - chroma
    env_file:
      - ./src/app/backend/.env
    environment:
      CHROMA_HOST: chroma
    networks:
      - backend_net
      - frontend_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: streamlit_app
    ports:
      - "8501:8501"
    depends_on:
      - api
    env_file:
      - ./src/app/frontend/.env
    environment:
      API_HOST: api
    networks:
      - frontend_net

volumes:
  chroma_data:

networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge
