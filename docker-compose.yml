services:
  chroma:
    image: chromadb/chroma
    container_name: chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  api:
    build: .
    container_name: fastapi_app
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      - chroma
    env_file:
      - ./src/app/backend/.env
    environment:
      CHROMA_HOST: chroma

volumes:
  chroma_data:
