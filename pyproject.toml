[build-system]
requires = ["setuptools >= 69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csds-352-vault"
version = "0.0.1"
description = "Data Science and Machine Learning Vault"
authors = [{name = "Jala R&D", email = "RD_GenerativeAI@jalasoft.com"}]
license = {file = "LICENSE"}
requires-python = ">=3.12"

dependencies = [
  "ipykernel==6.30.1",
  "ipympl==0.9.8",
  "matplotlib==3.10.7",
  "numpy==2.3.3",
  "pandas==2.3.3",
  "rich==14.2.0",
  "scikit-learn==1.7.2",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "seaborn==0.13.2",
  "sentence-transformers==5.1.1",
  "fastapi==0.119.0",
  "uvicorn==0.37.0",
  "streamlit==1.50.0",
  "python-dotenv==1.1.1",
  "python-multipart==0.0.20",
  "pypdf==6.1.1",
  "pydantic==2.12.0",
  "langchain==0.3.27",
  "langchain_chroma==0.2.6",
  "langchain-community==0.3.31",
  "langchain_core==0.3.79",
  "langchain-google-genai==2.1.12",
  "langchain_text_splitters==0.3.11",
  "langchain_huggingface==0.3.1"
]

[project.scripts]
csds-352-vault = "app.main:main"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true